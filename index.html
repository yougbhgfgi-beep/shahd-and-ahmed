        const playBeep = () => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (ctx.state === 'suspended') ctx.resume();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1400, ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.3, ctx.currentTime + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.4);
            } catch (e) { console.log(e); }

                                    <p>في زحمة الأيام ومشاغلها، وجدتُ نفسي أفكر فيكِ وفي كل ما تفعلينه من أجلي، وأردتُ أن أقف لحظة لأخبركِ بمدى امتنان قلبي لكِ.</p>

                                    <p className="mt-3">أردتُ فقط أن تدركي، في خضم مشاغل الحياة، أنكِ دائماً في تفكيري، وأنكِ السبب الأول لابتسامتي. شكراً لأنكِ أنتِ، وشكراً لأنكِ اخترتِ أن تشاركي طريقك معي. أعدكِ أن أكون دائماً بجانبك، داعماً ومحباً، وأن نظل معاً نكتب أجمل حكايات الحب.</p>

                                    <p className="mt-3">مرت الساعات وأنا أفكر كيف يمكن لأحد أن يكسر هذا الجمود دون أن يزعجها. لم أجد جريئاً بما يكفي للخطوة الأولى، حتى عدنا جميعاً، ولم أستطع إخراج صورتها من تفكيري.</p>

                                    <p className="mt-3">لم أكن أعلم حينها أن تلك المكالمة أو تلك الخطوة البسيطة من ريم ستكون بداية لنقطة تحول كاملة في حياتي. عندما بدأت أتعرف عليها عن قرب، اكتشفت أن صمتها لم يكن غروراً، بل كان نقاءً وعمقاً شديدين. مع مرور الوقت، وبدون أن تشعر هي حتى، بدأت تغير فيّ أشياء كثيرة نحو الأفضل. علمتني كيف أهدأ حين يشتعل كل شيء من حولي، وكيف أرى الجمال في أبسط التفاصيل. كانت حنيتها وطريقتها في فهم الحياة كفيلة بأن تجعلني شخصاً أكثر صبراً، أكثر نضجاً، وأكثر استقراراً من الداخل.</p>
                                </div>

                                <div className="bg-slate-800/40 p-6 rounded-2xl border border-rose-500/10">
                                    <h3 className="text-rose-400 font-bold text-2xl mb-4 font-script">وعدنا لبعض 💍</h3>
                                    <p>أكتب لكِ اليوم وأنا أضع أمام عينيّ هدفاً واحداً وحلماً لا يفارقني لحظة: اليوم الذي أجمع فيه ما أستطيع، وأسافر إليكِ في السودان لأتوج هذا الحب رباطاً أبدياً وتكونين فيه زوجتي أمام العالم كله.</p>

                                    <p className="mt-3">معلش يا عمري، هي فترة صعبة وسوف تمر بإذن الله، ولن يبقى منها سوى ذكرى نبتسم لها ونحن معاً تحت سقف واحد.</p>
                                    <p className="mt-3">اصبري معي وقوّي قلبكِ، فأنا أحارب الأيام من أجلنا، ومهما طال الطريق أو اشتدت الظروف، فأنِتِ وجهتي الوحيدة وحلمي الذي لن أتخلى عنه أبداً.</p>

        function MemoryGame() {
            const initialCards = ['🌹', '🌹', '💍', '💍', '💖', '💖', '👫', '👫', '🌍', '🌍', '💌', '💌'];
            const [cards, setCards] = useState([]);
            const [flipped, setFlipped] = useState([]);
            const [solved, setSolved] = useState([]);
            const [won, setWon] = useState(false);

            useEffect(() => {
                const shuffled = [...initialCards].sort(() => Math.random() - 0.5).map((emoji, index) => ({ id: index, emoji }));
                setCards(shuffled);
            }, []);

            useEffect(() => {
                if (solved.length > 0 && solved.length === initialCards.length) {
                    setTimeout(() => setWon(true), 1000);
                }
            }, [solved]);

            const handleClick = (index) => {
                if (flipped.includes(index) || solved.includes(index) || flipped.length >= 2) return;
                
                const newFlipped = [...flipped, index];
                setFlipped(newFlipped);
                
                if (newFlipped.length === 2) {
                    const [first, second] = newFlipped;
                    if (cards[first].emoji === cards[second].emoji) {
                        setSolved([...solved, first, second]);
                        setFlipped([]);
                    } else {
                        setTimeout(() => setFlipped([]), 800);
                    }
                }
            };

            return (
                <section className="py-24 relative z-10 bg-slate-900/50 backdrop-blur-sm border-y border-slate-800/50">
                    <div className="max-w-4xl mx-auto px-6 text-center">
                        <h2 className="text-4xl md:text-5xl font-bold mb-6 text-rose-300 drop-shadow-md">لعبة قلوبنا المتباعدة 🧩</h2>
                        <p className="text-slate-300 mb-12 text-xl font-medium">وصل كل قلبين ببعض عشان تشوف مفاجأتك يا روحي ❤️</p>
                        
                        <div className="grid grid-cols-3 md:grid-cols-4 gap-4 md:gap-6 justify-center max-w-2xl mx-auto">
                            {cards.map((card, i) => {
                                const isFlipped = flipped.includes(i) || solved.includes(i);
                                return (
                                    <div 
                                        key={i} 
                                        onClick={() => handleClick(i)}
                                        className={`aspect-square w-full rounded-2xl flex items-center justify-center text-4xl md:text-6xl cursor-pointer transition-all duration-300 transform border-2 ${isFlipped ? 'bg-slate-900 border-rose-500 shadow-[0_0_20px_rgba(244,63,94,0.3)] scale-[1.02]' : 'bg-slate-800/80 border-slate-700 hover:scale-105 shadow-xl hover:border-slate-500'}`}
                                    >
                                        <span className={`transition-all duration-300 drop-shadow-md ${isFlipped ? 'opacity-100 scale-100 rotate-0' : 'opacity-0 scale-50 -rotate-12'}`}>
                                            {card.emoji}
                                        </span>
                                    </div>
                                );
                            })}
                        </div>
                        
                        {won && (
                            <div className="fixed inset-0 z-[130] flex items-center justify-center bg-black/90 backdrop-blur-md p-4 animate-fade-in">
                                <div className="bg-slate-900/90 border border-rose-500/50 p-10 md:p-16 rounded-[3rem] shadow-[0_0_60px_rgba(225,29,72,0.5)] text-center max-w-2xl transform scale-110">
                                    <div className="text-7xl mb-6 animate-bounce">🎉❤️</div>
                                    <h3 className="text-4xl md:text-5xl font-bold text-rose-400 mb-8 font-script">اكتمل النصاب!</h3>
                                    <p className="text-xl md:text-2xl text-slate-200 leading-relaxed font-medium mb-12">
                                        تصدقي إن قلوبنا اتخلقت عشان تكمل بعض كده بالظبط؟ 😍 زي ما جمعتي القلوب دي، ربنا يجمعني بيكي دايماً وفي أسرع وقت يا شهد 💍💖
                                    </p>
                                    <button onClick={() => {
                                      setWon(false);
                                      setSolved([]);
                                      setCards([...initialCards].sort(() => Math.random() - 0.5).map((emoji, index) => ({ id: index, emoji })));
                                    }} className="bg-gradient-to-r from-rose-600 to-rose-800 text-white px-12 py-4 rounded-full text-xl font-bold shadow-[0_0_30px_rgba(225,29,72,0.6)] hover:scale-110 transition-transform w-full md:w-auto border border-rose-400/30">
                                        كملي يا حبيبتي ❤️
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>
                </section>
            );
        }

        function TimeBox({ label, value }) {
            return (
                <div className="bg-slate-900/60 backdrop-blur-md border border-slate-700 text-rose-400 w-24 sm:w-28 md:w-36 p-4 sm:p-6 md:p-8 rounded-[1.5rem] md:rounded-[2rem] shadow-[0_10px_30px_rgba(0,0,0,0.5)] transform hover:-translate-y-3 transition-transform hover:border-rose-500/50 hover:shadow-[0_0_20px_rgba(244,63,94,0.3)]">

                    {/* Glowing Moon */}

                    <button onClick={onClose} className="absolute top-6 md:top-8 right-6 md:right-8 text-slate-400 hover:text-white hover:rotate-90 transition-all duration-300 text-4xl md:text-5xl font-bold z-50">×</button>
                    
                    <div className="max-w-2xl w-full text-white relative z-10" dir="rtl">
                        {step === 1 && <h2 className="text-6xl md:text-8xl font-bold text-rose-500 animate-[pulse_2s_infinite] drop-shadow-[0_0_40px_rgba(225,29,72,0.8)]">إلى شهد.. ❤️</h2>}
                        {step >= 2 && step < 6 && (
                            <div className="space-y-8 md:space-y-12 animate-fade-in py-10">

                                        <p className="text-2xl md:text-4xl font-bold leading-relaxed shadow-red-900/40 drop-shadow-lg mb-6 text-rose-100">شهد.. أنتِ مش بس حبيبتي، أنتِ كل دنيتي وأماني.</p>
                                        <p className="text-xl md:text-2xl text-rose-300">كل ثانية معاكي هي عمر جديد بعيشه بسعادة.</p>
                                    </div>
                                )}
                                {step >= 3 && (
                                    <div className="animate-fade-in delay-500">
                                        <p className="text-2xl md:text-3xl font-bold text-white drop-shadow-[0_0_20px_rgba(255,255,255,0.5)]">وعد عليا إني هفضل ليكي نبض مبيقفش، وحب مبيخلصش.</p>
                                    </div>
                                )}
                                {step >= 4 && (
                                    <p className="text-4xl md:text-6xl font-script text-rose-400 mt-10 animate-bounce drop-shadow-[0_0_15px_rgba(251,113,133,0.5)]">بحبك فوق ما تتخيلي.. ❤️</p>
                                )}
                                {step >= 5 && (
                                    <p className="text-xl text-yellow-300 font-bold mt-6 tracking-wide">ربنا يخليكي ليا وما يحرمنيش منك أبداً يا كل دنيتي. 🏘🌎♥️</p>
                                )}
                            </div>
                        )}
                        {step >= 6 && (
                            <div className="animate-fade-in flex flex-col items-center">
                                <div className="mb-10 text-rose-500 bg-slate-900/50 p-6 rounded-full animate-float shadow-[0_0_40px_rgba(225,29,72,0.4)] border border-rose-500/20">
                                    <Heart size={80} fill="currentColor" className="animate-pulse" />
                                </div>
                                <h1 className="text-6xl md:text-9xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-rose-400 via-pink-500 to-red-500 mb-8 md:mb-12 font-script drop-shadow-2xl hero-title">أحمد ❤️ شهد</h1>
                                <p className="text-3xl md:text-4xl font-bold mb-4 text-slate-100">حبنا أقوى من كل شيء..</p>
                                <p className="text-4xl md:text-5xl font-bold text-rose-400 animate-pulse">إلى ما لا نهاية ♾️</p>
                                {step >= 7 && <p className="text-xl md:text-2xl text-slate-400 mt-10 font-serif italic border-t border-slate-800/80 pt-6">For the rest of our life.</p>}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        function BotChat() {
            const [isOpen, setIsOpen] = useState(false);
            const [messages, setMessages] = useState(() => {
                const saved = localStorage.getItem('romantic_chat_v3');
                if (saved) { try { return JSON.parse(saved); } catch(e) {} }
                return [{ id: 1, text: "أهلاً يا شهد ❤️.. أحمد بيفكر فيكي دلوقتي وعايز يقولك إنك أجمل حاجة في حياته!", sender: "bot", time: new Date().toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'}) }];
            });
            const [input, setInput] = useState("");
            const [isTyping, setIsTyping] = useState(false);
            const messagesEndRef = useRef(null);

            const getSmartReply = (msg) => {
                const lower = msg.toLowerCase().trim();
                const loveKeywords = ['بحبك', 'بحب', 'بحبكك', 'بحبن', 'بحبب', 'بحبي', 'بحبيبي', 'بحبيكت', 'بحبج', 'بحبكِ'];
                const missKeywords = ['وحشتن', 'وحشتين', 'وحشتي', 'توحش', 'افتكر', 'بفكر', '-plugins', 'مشتاق', 'مشتاقه'];
                const greetingKeywords = ['ازيك', 'عامل ايه', 'عامله ايه', 'ايه الاخبار', 'اخبارك', 'صباح', 'مساء', 'good morning', 'good night', 'هلا', 'مرحبا', 'السلام', 'سلام'];
                const sadKeywords = ['زعلان', 'زعلانه', 'تعبان', 'تعبانه', 'محتاج', 'محتاجه', 'وحيدة', 'وحيد', 'ضايع', 'ضايعه', 'م event', 'مش مرتاح', ' içerisinde', 'מור', 'mun'];
                const questionKeywords = ['مين', 'ايه', 'ليه', 'امتى', 'فين', 'ازاي', 'هنت', 'هنه', 'هنعمل', 'هنسافر'];
                const loveWords = ['حبيبي', 'حبيبتي', 'عمري', 'روحي', 'قلبي', 'نور عيني', ' حياتي', 'دنيتي', 'أمير', 'أميرة', 'ملك', 'ملكتي'];
                const praiseKeywords = ['جميل', 'جميلة', 'حلو', 'حلوة', 'ospital', 'عسل', 'قمر', 'كوكب', 'angel', 'ملك'];
                const futureKeywords = ['جاي', 'جية', 'هستنى', 'مستني', 'هستناك', 'هسيبك', 'هسيبكِ', 'من غيرك', ' مستقبل', ' forgiven', 'ه_far'];
                const promiseKeywords = ['وعد', 'بوعد', 'هفضل', 'مها', 'طول', 'أبدا', 'ابدا', '永远'];
                const thanksKeywords = ['شكرا', 'thanks', 'thank you', 'merci', 'ممنون', 'مشكور'];

                // Check for love
                if (loveKeywords.some(k => lower.includes(k))) {
                    const replies = [
                        "أنا كمان بحبك أوي يا شهد.. بحبك أكتر مما تتخيلي ❤️🔥",
                        "بحبك لحد ما تعب دماغي.. ومبطلش أحبك أبداً 💕",
                        "كل يوم بحبك أكتر من اللي قبله.. مش هعرف أوقف 🥺❤️",
                        "بحبك يا شهد.. مش بس كلمة، دي كل حياتي في جملة واحدة 💖",
                        "أنا بحبك مش عشان أنتِ حلوة، بحبك عشان أنتِ أنتِ.. اللي خلت حياتي أحلى ❤️"
                    ];
                    return replies[Math.floor(Math.random() * replies.length)];
                }

                // Check for missing
                if (missKeywords.some(k => lower.includes(k))) {
                    const replies = [
                        "وأنا كمان وحشتيني أوي يا شهد.. كل ثانية من غيرك زي السنة 🥺",
                        "وحشتيني من غير ما تمشي.. قلبي معاكي دايماً 💖",
                        "𝕎IANA وحشتيني أوي.. نفسي أشوفك دلوقتي وأحضنك 🤗❤️",
                        "كل يوم بيفكرني فيكي.. مش محتاج أفتكر، أنتِ في دماغي طول الوقت 💕",
                        "تخيّل إني حاسب كل دقيقة من غيرك.. وحشتيني أوي يا عمري 🥺"
                    ];
                    return replies[Math.floor(Math.random() * replies.length)];
                }

                // Check for greetings
                if (greetingKeywords.some(k => lower.includes(k))) {
                    const hour = new Date().getHours();
                    let timeGreeting = hour < 12 ? "صباح الخير" : hour < 18 ? "مساء النور" : "مساء الخير";
                    const replies = [
                        `${timeGreeting} يا شهد يا قمر.. عاملة إيه النهارده؟ ❤️`,
                        `${timeGreeting} يا حبيبتي.. أنتِ أحسن حاجة صحت فيها النهارده 🌹`,
                        `أهلاً يا شهد يا لوز.. عاملة إيه يا جميلة؟ 💕`,
                        `${timeGreeting} يا نور عيني.. كنت بفكر فيكي من شوية ❤️`
                    ];
                    return replies[Math.floor(Math.random() * replies.length)];
                }

                // Check for sadness
                if (sadKeywords.some(k => lower.includes(k))) {
                    const replies = [
                        "متعملش كده يا شهد.. أنا هنا ومش هسيبك أبداً ❤️ تعالى نتكلم",
                        "محتاجة أنا.. أنا دايماً جنبك حتى لو بعيد.. قلبي معاك 🥺💕",
                        "أنا عارف إن الأيام مش سهلة بس اصبري معايا يا عمري.. الجاي أحلى إن شاء الله 🌹",
                        "الزعل مش هيدوم يا حبيبتي.. وبعدين أنا مش هسيبك تزعلي لوحدك 💖",
                        "إيه اللي حصل يا شهد؟ قوليلي.. أنا هنا عشانك دايماً ❤️"
                    ];
                    return replies[Math.floor(Math.random() * replies.length)];
                }

                // Check for praise
                if (praiseKeywords.some(k => lower.includes(k))) {
                    const replies = [
                        "أنا اللي عايز أقولك إنتِ القمر اللي بيلمع في ليلي ☺️❤️",
                        "اللي يقول إنك حلوة بيتكلم في نص الحقيقة بس.. كل الحقيقة إنك أحلى من كل حاجة 🌙",
                        "أنا اللي محتاج أقولك كل يوم إنتِ أجمل بنت في الدنيا.. بس مش بعرف أوصف قد إيه ❤️",
                        "قمر يا شهد؟ لا.. أنتِ أكتر من قمر.. أنتِ الكون كله 🌌💕"
                    ];
                    return replies[Math.floor(Math.random() * replies.length)];
                }

                // Check for promises
                if (promiseKeywords.some(k => lower.includes(k))) {
                    const replies = [
                        "بوعدك يا شهد.. هفضل جنبك في كل لحظة في حياتي.. وم apla هسيبك أبداً 💍",
                        "وعد مني إني مش هتغير.. هفضل أحمد اللي بيحبك من الأول للأبد ❤️",
                        ".engineering بوعدك إني هخليكِ أسعد بنت في الدنيا.. وأحققلك كل حاجة تحلمي بيها 🌹",
                        "معلش يا عمري على كل لحظة صعبة مرّتك.. بس أنا هعوضك عن كل حاجة 💕"
                    ];
                    return replies[Math.floor(Math.random() * replies.length)];
                }

                // Check for thanks
                if (thanksKeywords.some(k => lower.includes(k))) {
                    const replies = [
                        "الشكر لله يا حبيبتي.. أنتِ اللي تستاهلي كل الخير في الدنيا 🥰",
                        "أنا مش محتاج شكر.. وجودك هو أكتر حاجة ربنا نعّمها عليا ❤️",
                        "الشكر ليكي يا شهد.. عشان موجودة في حياتي وبتخليها أحلى 💕"
                    ];
                    return replies[Math.floor(Math.random() * replies.length)];
                }

                // Check for questions
                if (questionKeywords.some(k => lower.includes(k))) {
                    if (lower.includes('بتحب') || lower.includes('بحبني')) {
                        return "بحبك أوي يا شهد.. أكتر حاجة في الدنيا.. بحبك وبعشقك وبحب كل حاجة فيكى ❤️🔥";
                    }
                    if (lower.includes('هتعمل') || lower.includes('هنت')) {
                        return "مهما عملت.. كل خطوة أنا فيها عشانك يا شهد.. عشان نكون مع بعضsoon إن شاء الله 💕";
                    }
                    if (lower.includes('岘')) {
                        return " في تفكيري دلوقتي.. بفكر في يوم هجمع كل حاجة وتيجيكي وأقولك كفاية بُعد ❤️";
                    }
                    return "سؤالك حلو يا شهد.. بس أنا عايز أعرف رأيك إنتي فيّ أكتر.. بتحبيني؟ 🥺❤️";
                }

                // Check for future/plans
                if (futureKeywords.some(k => lower.includes(k))) {
                    const replies = [
                        "جاي في سكتي يا شهد.. وأنا ماشي بأيامي عشان أجمع كل حاجة وتيجيكي 🚗❤️",
                        "المستقبل بتاعنا حلو أوي يا حبيبتي.. وأنا عارف إن ربنا هيبقى معانا 💕",
                        "anelo مش محتاج ت斯顿ى كتير يا شهد.. كل يوم بيقربنا من بعض أكتر 🌹"
                    ];
                    return replies[Math.floor(Math.random() * replies.length)];
                }

                // Default smart replies based on message length and context
                if (lower.length < 5) {
                    const short = [
                        "❤️",
                        "بحبك 🥰",
                        "oya.. بحبك",
                        "قلبي معاك 💕"
                    ];
                    return short[Math.floor(Math.random() * short.length)];
                }

                // Contextual default replies
                const smartDefaults = [
                    "أنا سامعك يا شهد.. وقلبي معاكي في كل كلمة بتقوليها ❤️",
                    "كلامك بيدخل قلبي يا حبيبتي.. أنا بحبك أوي 🥺💕",
                    "Thank you for existing يا شهد.. أنتِ أحلى هدية ربنا أدهالي في حياتي 🌹",
                    "أنا هنا.. ومش همشي.. أبداً يا شهد ❤️",
                    "übrigens بحب أسمع صوتك وبحب كلامك.. كملي بقي عشان أنا مستمتع 🥰",
                    "كل حاجة بتقوليها بتخلي قلبي ينبض أسرع يا شهد 💓",
                    "أنا مش بس بحبك.. أنا بعشقك يا عمري.. وبعشق كل تفصيلة فيكى 🔥❤️",
                    "يا شهد.. لو تعرفي قد إيه أنا سعيد إنك في حياتي.. مش هتسألي تاني 🥺💕"
                ];
                return smartDefaults[Math.floor(Math.random() * smartDefaults.length)];
            };

            useEffect(() => {
                localStorage.setItem('romantic_chat_v3', JSON.stringify(messages));
                scrollToBottom();
            }, [messages, isOpen, isTyping]);

            const scrollToBottom = () => {
                messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
            };

            const handleSend = () => {
                if (!input.trim()) return;
                const newMsg = {
                    id: Date.now(),
                    text: input,
                    sender: "user",
                    time: new Date().toLocaleTimeString('ar-EG', {hour: '2-digit', minute:'2-digit'})
                };
                setMessages(prev => [...prev, newMsg]);
                const userText = input;
                setInput("");
                setIsTyping(true);
                const typingDelay = 800 + Math.min(userText.length * 30, 2000) + Math.random() * 700;
                setTimeout(() => {
                    const reply = {
                        id: Date.now() + 1,
                        text: getSmartReply(userText),
                        sender: "bot",
                        time: new Date().toLocaleTimeString('ar-EG', {hour: '2-digit', minute:'2-digit'})
                    };
                    setMessages(prev => [...prev, reply]);
                    setIsTyping(false);
                }, typingDelay);
            };

            const deleteMessage = (id) => {
                setMessages(prev => prev.filter(m => m.id !== id));
            };

            const clearChat = () => {
                if(confirm("هل أنت متأكد من مسح جميع الرسائل؟")) {
                    setMessages([{ id: 1, text: "مسحت الرسائل بس مش همسح حبنا.. ده محفور في قلبي للأبد 🥺❤️", sender: "bot", time: new Date().toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'}) }]);
                }
            };

            return (
                <div className="fixed bottom-6 left-6 md:bottom-10 md:left-10 z-[110]" dir="rtl">
                    {!isOpen ? (
                        <button onClick={() => setIsOpen(true)} className="w-16 h-16 md:w-20 md:h-20 bg-gradient-to-tr from-rose-600 to-indigo-700 rounded-full shadow-[0_0_20px_rgba(225,29,72,0.6)] cursor-pointer flex items-center justify-center hover:scale-110 transition-transform animate-pulse border-2 border-white/20 text-white">
                            <svg viewBox="0 0 24 24" width="32" height="32" stroke="currentColor" strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                        </button>
                    ) : (
                        <div className="bg-slate-100 w-[90vw] md:w-[350px] h-[75vh] md:h-[500px] max-h-[80vh] rounded-3xl shadow-[0_15px_50px_rgba(0,0,0,0.5)] overflow-hidden flex flex-col font-sans animate-fade-in relative z-[120] border border-slate-300">
                            {/* Header */}
                            <div className="bg-gradient-to-r from-rose-600 to-indigo-700 text-white p-3 flex items-center justify-between shadow-md relative z-20">
                                <div className="flex items-center gap-3">
                                    <button onClick={() => setIsOpen(false)} className="text-white hover:text-slate-200 p-1">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                                    </button>
                                    <div className="w-10 h-10 bg-white rounded-full flex items-center justify-center text-rose-600 font-bold overflow-hidden border-2 border-white/50">ش</div>
                                    <div>
                                        <h3 className="font-bold text-lg leading-tight">نبض القلب 💓</h3>
                                        <p className="text-xs text-rose-200">{isTyping ? "يكتب الآن..." : "متصل الآن"}</p>
                                    </div>
                                </div>
                                <button onClick={clearChat} className="text-white hover:text-red-300 p-2" title="مسح المحادثة">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                                </button>
                            </div>

                            {/* Chat Body */}
                            <div className="flex-1 p-4 overflow-y-auto relative scroll-smooth flex flex-col gap-3 bg-slate-50">
                                {messages.map((m) => (
                                    <div key={m.id} className={`max-w-[85%] rounded-2xl p-3 shadow-sm relative group text-sm md:text-base ${m.sender === "user" ? 'bg-indigo-600 text-white self-end rounded-bl-sm' : 'bg-white text-slate-800 self-start rounded-br-sm border border-slate-200'}`}>
                                        <button onClick={() => deleteMessage(m.id)} className={`absolute top-1/2 -translate-y-1/2 hidden group-hover:flex items-center justify-center p-1.5 rounded-full bg-red-100 text-red-600 hover:bg-red-200 transition ${m.sender === "user" ? "-left-10" : "-right-10"}`} title="حذف الرسالة">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                                        </button>
                                        <p className="whitespace-pre-wrap leading-relaxed">{m.text}</p>
                                        <div className={`text-[10px] mt-1 flex justify-end gap-1 items-center ${m.sender === "user" ? "text-indigo-200" : "text-slate-400"}`}>
                                            {m.time}
                                            {m.sender === "user" && (
                                                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6 7 17l-5-5"/><path d="m22 10-7.5 7.5L13 16"/></svg>
                                            )}
                                        </div>
                                    </div>
                                ))}
                                {isTyping && (
                                    <div className="bg-white border border-slate-200 self-start rounded-2xl rounded-br-sm p-3 shadow-sm w-16 h-10 flex items-center justify-center gap-1.5 text-slate-800">
                                        <div className="w-2 h-2 bg-slate-400 rounded-full animate-bounce" style={{animationDelay: "0ms"}}></div>
                                        <div className="w-2 h-2 bg-slate-400 rounded-full animate-bounce" style={{animationDelay: "150ms"}}></div>
                                        <div className="w-2 h-2 bg-slate-400 rounded-full animate-bounce" style={{animationDelay: "300ms"}}></div>
                                    </div>
                                )}
                                <div ref={messagesEndRef} className="pb-2 text-transparent">.</div>
                            </div>

                            {/* Input Area */}
                            <div className="bg-white p-3 flex items-center gap-2 border-t border-slate-200">
                                <div className="flex-1 bg-slate-100 rounded-full flex items-center px-4 py-2 border border-slate-200">
                                    <input 
                                        type="text"
                                        value={input}
                                        onChange={(e) => setInput(e.target.value)}
                                        onKeyPress={(e) => e.key === 'Enter' && handleSend()}
                                        placeholder="اكتب لأحمد أي حاجة.."
                                        className="flex-1 outline-none border-none bg-transparent text-slate-800 placeholder-slate-400 text-sm md:text-base w-full"
                                    />
                                </div>
                                <button 
                                    onClick={handleSend}
                                    className={`w-12 h-12 rounded-full flex items-center justify-center shadow-md transition-colors ${input.trim() ? 'bg-rose-600 hover:bg-rose-700' : 'bg-slate-300'} text-white shrink-0`}
                                >
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" className="mr-1 -ml-1"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<LoveWebsite />);
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/shahd-and-ahmed/sw.js').catch(() => {});
        }
    </script>
</body>

</html>
